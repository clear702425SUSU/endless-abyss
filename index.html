<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>無盡深淵 V4</title><style>
:root{color-scheme:dark;font-family:system-ui,"Noto Sans TC",sans-serif;background:#090e1b;color:#f1e9d5}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#293049,#090e1b 75%)}header{padding:16px;text-align:center;border-bottom:1px solid #66563b}h1{margin:0;color:#f4ce81;font-size:clamp(24px,5vw,38px)}small,.muted{color:#b6b4bd}main{max-width:1180px;margin:auto;padding:12px;display:grid;grid-template-columns:minmax(300px,1.3fr) minmax(280px,1fr);gap:14px}.panel{background:#141c2c;border:1px solid #5b5260;border-radius:12px;padding:13px;box-shadow:0 8px 24px #0006}h2{margin:3px 0 10px;color:#e6c488;font-size:19px}button,select{background:#26344a;color:#fff1d4;border:1px solid #84724c;border-radius:8px;padding:10px;cursor:pointer;font:inherit}button:hover{background:#3e5065}button:disabled{opacity:.35}button:focus-visible{outline:3px solid #f7ce68}.classes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.classes button{min-height:75px}.classes button.active{background:#69502b;border:2px solid #f2d18d}.stats{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}.bar{height:12px;background:#3a2630;border-radius:12px;overflow:hidden;margin:5px 0}.bar i{display:block;height:100%;background:#b34f63}.bar.mana i{background:#508dcc}.bar.xp i{background:#a5aa50}.map{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:2px;max-width:650px;margin:auto;aspect-ratio:1;background:#0a0e18;padding:5px;border:2px solid #736344;border-radius:8px}.tile{display:flex;align-items:center;justify-content:center;border-radius:3px;font-size:clamp(12px,2.7vw,24px);user-select:none;position:relative}.wall{background:#333b4b}.floor{background:#303b47}.hidden{background:#090e18}.fog{background:#1b2330;color:#737b87}.hero{background:#9c7538;box-shadow:inset 0 0 10px #ffde82;color:white}.monster{background:#64333e}.boss{background:#852c44}.exit{background:#356a67}.chest{background:#71542b}.spring{background:#2b657b}.trap{background:#624557}.controls{display:grid;grid-template-columns:repeat(3,56px);justify-content:center;gap:6px;margin:12px}.controls button{font-size:22px;padding:8px}.actions{display:grid;grid-template-columns:repeat(2,1fr);gap:7px}.actions button{min-height:48px}.log{max-height:165px;overflow:auto;font-size:13px;line-height:1.6}.log div{border-bottom:1px solid #30394a;padding:4px}.quest{border-bottom:1px solid #404657;padding:8px 0}.quest b{color:#d7bf86}.tag{font-size:12px;color:#8fd0d0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.danger{color:#ff9a98}.hint{font-size:13px;color:#d1c6ac}#fx{min-height:25px;color:#f5d077;text-align:center;font-weight:700}@media(max-width:790px){main{grid-template-columns:1fr}.map{max-width:100%}.classes{grid-template-columns:repeat(3,1fr)}} </style></head><body><header><h1>⚔ 無盡深淵：迷宮紀元</h1><small>V4 · 東西幻想交會之地 · 單機探索 RPG</small></header><main><section><div class="panel"><div class="top"><h2>深淵迷宮 <span id="floor"></span></h2><span id="biome" class="tag"></span></div><div id="map" class="map" role="img" aria-label="地下城迷宮"></div><div id="fx" aria-live="polite"></div><div class="controls"><span></span><button onclick="move(0,-1)" aria-label="上">↑</button><span></span><button onclick="move(-1,0)" aria-label="左">←</button><button onclick="rest()" aria-label="原地休息">◎</button><button onclick="move(1,0)" aria-label="右">→</button><span></span><button onclick="move(0,1)" aria-label="下">↓</button><span></span></div><p class="hint">方向鍵 / WASD 移動；撞擊怪物可普攻。擊敗守關者後踏上傳送門。角色死亡可重新冒險。</p></div><div class="panel"><h2>冒險日誌</h2><div id="log" class="log" aria-live="polite"></div></div></section><section><div class="panel"><h2>六大職業</h2><div id="classes" class="classes"></div><p class="hint">切換職業會開始新冒險。每個職業有三個專屬技能。</p><div id="stats"></div><div class="stats"><span id="gold"></span><span id="kills"></span><span id="potions"></span></div><div class="top"><button onclick="drink()">🧪 使用藥水</button><button onclick="resetGame()">重新冒險</button></div></div><div class="panel"><h2>職業技能</h2><div id="skills" class="actions"></div><p class="hint">技能可對相鄰怪物造成傷害；部分技能能遠程、群攻或治療。</p></div><div class="panel"><h2>裝備與戰利品</h2><div id="gear"></div></div><div class="panel"><h2>冒險委託</h2><div id="quests"></div></div></section></main><script>
"use strict";
const W=13,H=13,KEY="endless-abyss-v4-save";
const JOBS=[
{name:"戰士",icon:"🛡️",hp:140,mp:45,atk:16,def:7,skills:[["破軍斬",8,"strike",2.2],["戰吼",10,"guard",0],["旋風斬",18,"aoe",1.5]]},
{name:"法師",icon:"🔮",hp:90,mp:115,atk:13,def:2,skills:[["烈焰術",12,"ranged",2.3],["寒霜環",18,"aoe",1.5],["冥想",0,"mana",0]]},
{name:"盜賊",icon:"🗡️",hp:105,mp:65,atk:17,def:3,skills:[["影襲",9,"strike",2.5],["煙幕",12,"guard",0],["奪寶",16,"steal",1.2]]},
{name:"遊俠",icon:"🏹",hp:110,mp:75,atk:15,def:4,skills:[["穿雲箭",11,"ranged",2.1],["箭雨",19,"aoe",1.4],["自然療癒",15,"heal",0]]},
{name:"聖騎士",icon:"✨",hp:130,mp:80,atk:13,def:7,skills:[["聖光裁決",12,"strike",2],["守護聖盾",14,"guard",0],["神聖治療",18,"heal",0]]},
{name:"死靈術士",icon:"💀",hp:95,mp:105,atk:15,def:3,skills:[["靈魂汲取",12,"drain",1.8],["亡者之潮",20,"aoe",1.6],["血之契約",0,"blood",0]]}
];
const MON=[["骷髏兵","☠️"],["妖狐","🦊"],["暗影騎士","♞"],["地穴蜘蛛","🕷️"],["石像鬼","👹"],["幽魂","👻"],["魔狼","🐺"],["腐化樹精","🌳"]];
const BIOMES=["晚唐古墓","幽影城堡","水晶地窟","深淵祭壇","失落神殿","熔岩裂谷"];
let s;
const $=id=>document.getElementById(id),rand=n=>Math.floor(Math.random()*n),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function fresh(job=0){const j=JOBS[job];s={job,level:1,xp:0,floor:1,hp:j.hp,mp:j.mp,gold:0,kills:0,potions:3,atk:j.atk,def:j.def,gear:[],quests:[],logs:[],guard:0,dead:false,turn:0};generate();newQuests();say("你踏入深淵，古老的封印開始震動。");save();render()}
function generate(){let grid=Array.from({length:H},()=>Array(W).fill(1));let x=1,y=1;grid[y][x]=0;for(let n=0;n<450;n++){let [dx,dy]=[[1,0],[-1,0],[0,1],[0,-1]][rand(4)];x=clamp(x+dx,1,W-2);y=clamp(y+dy,1,H-2);grid[y][x]=0}for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++)if(Math.random()<.24&&grid[y][x]===1&&grid[y].slice(Math.max(0,x-1),x+2).includes(0))grid[y][x]=0;
const seen=new Set(),q=[[1,1]];while(q.length){const [cx,cy]=q.shift(),k=cx+","+cy;if(seen.has(k)||grid[cy]?.[cx]!==0)continue;seen.add(k);for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]])q.push([cx+dx,cy+dy])}
let cells=[...seen].map(t=>t.split(",").map(Number)).filter(([a,b])=>a+b>5);cells.sort((a,b)=>(b[0]+b[1])-(a[0]+a[1]));const exit=cells.shift()||[1,1];const objects=[];function put(type,count){for(let i=0;i<count&&cells.length;i++){const at=rand(cells.length),[a,b]=cells.splice(at,1)[0];objects.push({x:a,y:b,type,hp:type==="boss"?70+s.floor*22:18+s.floor*9,atk:type==="boss"?10+s.floor*3:4+s.floor*2,name:type==="boss"?"深淵守關者":MON[rand(MON.length)][0],icon:type==="boss"?"🐉":MON[rand(MON.length)][1]})}}put("boss",s.floor%5===0?1:0);put("monster",5+Math.min(5,Math.floor(s.floor/3)));put("chest",3);put("spring",1);put("trap",2);s.map=grid;s.seen=[];s.x=1;s.y=1;s.exit=exit;s.objects=objects;s.guard=0;reveal()}
function reveal(){for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){const x=s.x+dx,y=s.y+dy;if(x>=0&&y>=0&&x<W&&y<H&&!s.seen.includes(x+","+y))s.seen.push(x+","+y)}}
function say(msg){s.logs.unshift(msg);s.logs=s.logs.slice(0,35);$("fx").textContent=msg}
function save(){try{localStorage.setItem(KEY,JSON.stringify(s))}catch(e){}}
function maxhp(){return JOBS[s.job].hp+(s.level-1)*15}function maxmp(){return JOBS[s.job].mp+(s.level-1)*8}
function enemyAt(x,y){return s.objects.find(o=>o.x===x&&o.y===y&&(o.type==="monster"||o.type==="boss"))}
function objAt(x,y){return s.objects.find(o=>o.x===x&&o.y===y)}
function hit(e,dmg){e.hp-=Math.max(1,Math.round(dmg));say("擊中"+e.name+"，造成 "+Math.max(1,Math.round(dmg))+" 傷害！");if(e.hp<=0){s.objects=s.objects.filter(o=>o!==e);s.kills++;s.gold+=4+s.floor*2;gainXp(12+s.floor*5);say("擊敗 "+e.name+"，獲得戰利品！");if(Math.random()<.24)loot();if(Math.random()<.17)s.potions++;updateQuests()}}
function gainXp(v){s.xp+=v;while(s.xp>=s.level*35){s.xp-=s.level*35;s.level++;s.atk+=3;s.def++;s.hp=maxhp();s.mp=maxmp();say("升級！現在是 "+s.level+" 級。")}}
function retaliation(){if(s.dead)return;const threats=s.objects.filter(o=>(o.type==="monster"||o.type==="boss")&&Math.abs(o.x-s.x)+Math.abs(o.y-s.y)===1);if(threats.length){const e=threats[rand(threats.length)];const dmg=Math.max(1,e.atk-s.def-(s.guard?8:0)+rand(4));s.hp-=dmg;say(e.name+" 反擊，受到 "+dmg+" 傷害");if(s.hp<=0){s.hp=0;s.dead=true;say("冒險終結。可重新開始。")}}s.guard=Math.max(0,s.guard-1)}
function move(dx,dy){if(s.dead)return;const x=s.x+dx,y=s.y+dy;if(s.map[y]?.[x]!==0)return;const e=enemyAt(x,y);if(e){hit(e,s.atk+rand(7));retaliation()}else{s.x=x;s.y=y;const o=objAt(x,y);if(o){if(o.type==="chest"){s.gold+=12+s.floor*4;loot();say("開啟古老寶箱！")}if(o.type==="spring"){s.hp=Math.min(maxhp(),s.hp+35);s.mp=Math.min(maxmp(),s.mp+30);say("泉水恢復生命與法力。")}if(o.type==="trap"){s.hp=Math.max(1,s.hp-8-s.floor*2);say("踩中機關陷阱！")}s.objects=s.objects.filter(t=>t!==o)}reveal();if(x===s.exit[0]&&y===s.exit[1]){if(s.objects.some(o=>o.type==="boss"))say("守關者尚未被擊敗！");else{s.floor++;s.hp=Math.min(maxhp(),s.hp+25);s.mp=Math.min(maxmp(),s.mp+20);generate();say("抵達地下城第 "+s.floor+" 層！");updateQuests()}}else retaliation()}s.turn++;save();render()}
function targets(range){return s.objects.filter(o=>(o.type==="monster"||o.type==="boss")&&Math.abs(o.x-s.x)+Math.abs(o.y-s.y)<=range).sort((a,b)=>(Math.abs(a.x-s.x)+Math.abs(a.y-s.y))-(Math.abs(b.x-s.x)+Math.abs(b.y-s.y)))}
function skill(i){if(s.dead)return;const [name,cost,type,mult]=JOBS[s.job].skills[i];if(s.mp<cost){say("法力不足！");render();return}const ts=targets(type==="ranged"?4:type==="aoe"?2:1);if(["strike","ranged","aoe","steal","drain"].includes(type)&&!ts.length){say("技能範圍內沒有敵人。");render();return}s.mp-=cost;if(type==="guard"){s.guard=3;say(name+"：獲得三回合防護！")}else if(type==="heal"){s.hp=Math.min(maxhp(),s.hp+Math.round(maxhp()*.38));say(name+"：恢復生命。")}else if(type==="mana"){s.mp=Math.min(maxmp(),s.mp+38);say("冥想恢復法力。")}else if(type==="blood"){s.hp=Math.max(1,s.hp-18);s.mp=Math.min(maxmp(),s.mp+45);say("以生命換取法力！")}else{const hits=type==="aoe"?ts:ts.slice(0,1);hits.forEach(e=>hit(e,s.atk*mult+rand(8)));if(type==="drain")s.hp=Math.min(maxhp(),s.hp+16);if(type==="steal")s.gold+=10+s.floor*2}retaliation();save();render()}
function loot(){const slots=["武器","護甲","飾品"],adjs=["古唐","星隕","秘銀","幽冥","龍骨","聖輝"],nouns=["長劍","法杖","戰甲","玉佩","戒指","護符"];const rarity=rand(100),tier=rarity<55?1:rarity<82?2:rarity<96?3:4;const item={name:adjs[rand(adjs.length)]+nouns[rand(nouns.length)],slot:slots[rand(3)],tier,bonus:tier*2+rand(4)+Math.floor(s.floor/2)};const old=s.gear.find(o=>o.slot===item.slot);if(!old||item.bonus>old.bonus){if(old){if(old.slot==="武器")s.atk-=old.bonus;else s.def-=old.bonus}s.gear=s.gear.filter(o=>o.slot!==item.slot);s.gear.push(item);if(item.slot==="武器")s.atk+=item.bonus;else s.def+=item.bonus;say("裝備 "+item.name+"（+"+item.bonus+"）")}else{s.gold+=item.bonus*3;say("出售 "+item.name+"，換取金幣。")}}
function drink(){if(s.dead||s.potions<1)return;s.potions--;s.hp=Math.min(maxhp(),s.hp+65);say("飲用治療藥水。");save();render()}
function rest(){if(s.dead)return;s.mp=Math.min(maxmp(),s.mp+5);retaliation();save();render()}
function newQuests(){s.quests=[{type:"kill",goal:4+rand(4),base:s.kills,title:"討伐深淵魔物"},{type:"floor",goal:s.floor+2,base:s.floor,title:"深入未知遺跡"},{type:"gold",goal:s.gold+80,base:s.gold,title:"搜集古代寶藏"}]}
function updateQuests(){for(const q of s.quests){const now=q.type==="kill"?s.kills:q.type==="floor"?s.floor:s.gold;if(now>=q.goal){s.gold+=35+s.floor*3;gainXp(30+s.floor*5);say("完成委託："+q.title+"！");q.base=now;q.goal=now+(q.type==="floor"?2:q.type==="kill"?4+rand(5):80+s.floor*8)}}}
function render(){const job=JOBS[s.job];$("floor").textContent="第 "+s.floor+" 層";$("biome").textContent=BIOMES[Math.floor((s.floor-1)/3)%BIOMES.length];$("classes").innerHTML=JOBS.map((j,i)=>'<button class="'+(i===s.job?"active":"")+'" onclick="changeJob('+i+')">'+j.icon+"<br>"+j.name+"</button>").join("");$("stats").innerHTML='<b>'+job.icon+" "+job.name+"　Lv."+s.level+(s.dead?' <span class="danger">已陣亡</span>':"")+'</b><div>生命 '+s.hp+'/'+maxhp()+'</div><div class="bar"><i style="width:'+100*s.hp/maxhp()+'%"></i></div><div>法力 '+s.mp+'/'+maxmp()+'</div><div class="bar mana"><i style="width:'+100*s.mp/maxmp()+'%"></i></div><div>經驗 '+s.xp+'/'+s.level*35+'</div><div class="bar xp"><i style="width:'+100*s.xp/(s.level*35)+'%"></i></div><div>攻擊 '+s.atk+'　防禦 '+s.def+'</div>';$("gold").textContent="🪙 "+s.gold;$("kills").textContent="⚔️ "+s.kills+" 擊殺";$("potions").textContent="🧪 "+s.potions;$("skills").innerHTML=job.skills.map((a,i)=>'<button '+(s.dead||s.mp<a[1]?'disabled':'')+' onclick="skill('+i+')">'+a[0]+' <small>MP '+a[1]+'</small></button>').join("");$("gear").innerHTML=s.gear.length?s.gear.map(g=>'<p>✦ '+g.slot+'｜'+g.name+' <span class="tag">+'+g.bonus+' · '+["","普通","精良","史詩","傳說"][g.tier]+'</span></p>').join(""):'<p class="muted">尚無裝備，探索寶箱取得戰利品。</p>';$("quests").innerHTML=s.quests.map(q=>{const n=q.type==="kill"?s.kills:q.type==="floor"?s.floor:s.gold;return '<div class="quest"><b>'+q.title+'</b><div>'+Math.max(0,n-q.base)+' / '+(q.goal-q.base)+' <span class="tag">循環委託</span></div></div>'}).join("");$("log").innerHTML=s.logs.map(x=>'<div>'+x+'</div>').join("");let tiles="";for(let y=0;y<H;y++)for(let x=0;x<W;x++){let cls="hidden",glyph="";if(s.seen.includes(x+","+y)){if(s.map[y][x]){cls="wall";glyph="▦"}else{cls="floor";glyph="·";const o=objAt(x,y);if(o){cls=o.type;glyph=o.type==="monster"?o.icon:o.type==="boss"?"🐉":o.type==="chest"?"🎁":o.type==="spring"?"💧":"⚠"}if(x===s.exit[0]&&y===s.exit[1]){cls="exit";glyph="⛩"}if(x===s.x&&y===s.y){cls="hero";glyph=job.icon}}} }tiles+='<div class="tile '+cls+'" title="'+x+','+y+'">'+glyph+'</div>'}$("map").innerHTML=tiles}
function changeJob(i){if(i===s.job)return;if(confirm("切換職業將重啟冒險，確定嗎？"))fresh(i)}
function resetGame(){if(confirm("確定重啟冒險？目前進度將被覆蓋。"))fresh(s.job)}
window.addEventListener("keydown",e=>{if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","w","a","s","d","W","A","S","D"].includes(e.key)){e.preventDefault();const k=e.key.toLowerCase();move(k==="arrowleft"||k==="a"?-1:k==="arrowright"||k==="d"?1:0,k==="arrowup"||k==="w"?-1:k==="arrowdown"||k==="s"?1:0)}});
try{const data=JSON.parse(localStorage.getItem(KEY));if(data&&Array.isArray(data.map)&&Array.isArray(data.objects)&&Number.isInteger(data.job)&&data.job>=0&&data.job<6){s=data;render()}else fresh()}catch(e){fresh()}
</script></body></html>
